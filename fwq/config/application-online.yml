# ============================================
# SnowIsland 线上环境配置文件
# ============================================
# 此文件会与 application.yml 合并，相同配置会被覆盖

spring:
  profiles:
    active: online

  # 线上数据库配置（使用环境变量）
  datasource:
    url: jdbc:mysql://mysql:3306/snowisland?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:695390489}

  # JPA 配置
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# AI 配置（线上使用环境变量）
ai:
  dashscope:
    api-key: ${AI_API_KEY}

# 线上日志级别（更严格）
logging:
  level:
    root: WARN
    com.example.snowisland: INFO
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  file:
    name: /var/log/snowisland/application.log
